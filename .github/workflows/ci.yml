name: Django CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Cancela execuções antigas da mesma PR se o dev fizer um novo git push rápido
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: "config.settings"

jobs:
  # =========================================================================
  # JOB 1: Lint, Formatação, Tipagem e Segurança (Roda em ~20 segundos)
  # =========================================================================
  code-quality:
    name: Qualidade & Segurança (Ruff, Mypy, Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy django-stubs bandit

      - name: Rodar Ruff (Linter)
        run: ruff check .

      - name: Rodar Ruff (Checagem de Formatação)
        run: ruff format --check .

      - name: Rodar Mypy (Checagem Estática de Tipos)
        run: mypy .

      - name: Rodar Bandit (Análise de Vulnerabilidades de Segurança)
        run: bandit -r . -x ./tests,./pagamentos/tests,./venv,./.venv

  # =========================================================================
  # JOB 2: Validação do Django e Suíte de Testes com PostgreSQL
  # =========================================================================
  tests:
    name: Testes & Migrations (Pytest + Postgres 16)
    runs-on: ubuntu-latest

    # Sobe um container de PostgreSQL real exclusivo para este job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://postgres:postgres_password@localhost:5432/test_db"
      SECRET_KEY: "chave-secreta-apenas-para-ambiente-de-ci"
      DEBUG: "False"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pytest-xdist

      # PULO DO GATO 1: Valida configurações internas do Django (segurança, rotas, etc.)
      - name: Django System Check
        run: python manage.py check --deploy

      # PULO DO GATO 2: Falha o CI se algum dev alterou um Model mas esqueceu de gerar a migration!
      - name: Verificar se existem Migrations pendentes não commitadas
        run: python manage.py makemigrations --check --dry-run

      # Executa os testes em paralelo (-n auto) e exige mínimo de 85% de cobertura de código
      - name: Rodar Testes com Pytest e Cobertura
        run: |
          pytest -n auto --cov=. --cov-report=term-missing --cov-fail-under=85
