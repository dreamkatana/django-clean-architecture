[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "migrations",
]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
omit = [
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.bandit]
exclude_dirs = ["tests", "pagamentos/tests", ".venv", "venv"]
skips = ["B101"]
